services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-incidentdb}
      POSTGRES_USER: ${DB_USER:-incident_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-incident_password}
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-incident_user} -d ${DB_NAME:-incidentdb}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install --no-package-lock && npm run dev"
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
    environment:
      NODE_ENV: development
      PORT: 5000
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-incidentdb}
      DB_USER: ${DB_USER:-incident_user}
      DB_PASSWORD: ${DB_PASSWORD:-incident_password}
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install --no-package-lock && npm run dev"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  postgres_dev_data:
  backend_node_modules:
  frontend_node_modules:
